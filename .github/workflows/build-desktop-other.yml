name: Build Desktop (Windows + Linux)

# Manual only — builds the Tauri .exe (NSIS installer) and .deb on GitHub's
# free Windows/Linux runners. Trigger from the Actions tab, or:
# gh workflow run build-desktop-other.yml
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web export
        working-directory: apps/mobile
        run: pnpm exec expo export --platform web

      - name: Build the .exe (NSIS)
        working-directory: apps/mobile/src-tauri
        run: pnpm exec tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: islam-pro-installer-exe
          path: apps/mobile/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Tauri/GTK/WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web export
        working-directory: apps/mobile
        run: pnpm exec expo export --platform web

      - name: Build the .deb
        working-directory: apps/mobile/src-tauri
        run: pnpm exec tauri build --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: islam-pro-installer-deb
          path: apps/mobile/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

      - name: Locate the .deb
        id: deb
        # cloudsmith-io/action's entrypoint.sh passes -F ${{ inputs.file }}
        # unquoted, so a filename with a space (Tauri's default "Islam
        # Pro_1.0.0_amd64.deb") breaks its getopts parsing. Rename to a
        # space-free path first.
        run: |
          src=$(find apps/mobile/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb')
          dest="apps/mobile/src-tauri/target/release/bundle/deb/islam-pro_1.0.0_amd64.deb"
          mv "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Publish to Cloudsmith APT repo
        uses: cloudsmith-io/action@v0.6.7
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: push
          format: deb
          owner: furax-dev
          repo: islam-pro
          distro: ubuntu
          release: jammy
          republish: true
          file: ${{ steps.deb.outputs.path }}
